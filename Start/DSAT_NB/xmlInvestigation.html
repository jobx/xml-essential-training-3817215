<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Investigation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
    }

    #xmlFileInput {
      display: none;
    }

    #xmlFileLabel {
      display: inline-block;
      margin-left: 8px;
      font-size: 13px;
      color: #345;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }

    #loadXmlBtn {
      padding: 8px 14px;
      border: 1px solid #5b7db1;
      border-radius: 6px;
      background: #eaf1ff;
      color: #1f2d3d;
      font-size: 14px;
      cursor: pointer;
    }

    #content {
      white-space: pre-wrap;
      background: #f4f4f4;
      border: 1px solid #ccc;
      padding: 12px;
      margin-top: 16px;
      min-height: 120px;
    }
  </style>
</head>
<body>
  <h2>XML Investigation</h2>

  <input type="file" id="xmlFileInput" accept=".xml,application/xml,text/xml" style="display: none;" />
  <label id="xmlFileLabel">No file selected</label>
  <button id="loadXmlBtn" type="button">Load XML</button>

  <div id="content">No XML loaded.</div>
</body>
<script type="text/javascript">
    const xmlFileInput = document.getElementById("xmlFileInput");
    const xmlFileLabel = document.getElementById("xmlFileLabel");
    const contentDiv = document.getElementById("content");
    let lastValidXmlFile = null;

    function updateXmlFileLabel(file) {
        if (!file) {
            xmlFileLabel.textContent = "No file selected";
            return;
        }

        const fullPath = file && file.name ? file.name : "";
        xmlFileLabel.textContent = fullPath || "No file selected";
    }

    async function loadXMLDoc(docURL) {
        let doc = await fetch(docURL);
        let response = await doc.text();
        let xml = new DOMParser().parseFromString(response, "text/xml");
        return xml;
    }

    xmlFileInput.addEventListener("change", async function () {
        const file = this.files && this.files[0];
        if (!file) {
            return;
        }

        lastValidXmlFile = file;
        updateXmlFileLabel(file);

        const docURL = URL.createObjectURL(file);
        try {
            const xml = await loadXMLDoc(docURL);
            contentDiv.textContent = new XMLSerializer().serializeToString(xml.documentElement);
        } catch (error) {
            console.error("Error loading XML:", error);
            contentDiv.textContent = "Unable to load XML file.";
        }
    });

    document.getElementById("loadXmlBtn").addEventListener("click", function () {
        xmlFileInput.click();
    });
</script>
</html>
